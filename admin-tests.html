<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>All Tests — Admin — Alpharia</title>
    <meta name="description" content="Manage all reading assessment tests.">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="css/student-dashboard-clean.css">
    <link rel="stylesheet" href="css/teacher-dashboard-clean.css">
    <style>
        @keyframes fadeIn { from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)} }
        @keyframes slideIn { from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)} }

        .at-toolbar { display:flex; gap:0.75rem; margin-bottom:1.5rem; flex-wrap:wrap; align-items:center; }
        .at-search-wrap { position:relative; flex:1; min-width:220px; }
        .at-search-wrap i { position:absolute; left:0.85rem; top:50%; transform:translateY(-50%); color:var(--sd-text-3); }
        .at-search {
            width:100%; padding:0.6rem 1rem 0.6rem 2.5rem;
            border:1.5px solid var(--sd-border); border-radius:var(--sd-radius-sm);
            font-family:inherit; font-size:0.85rem; background:var(--sd-surface); color:var(--sd-text);
        }
        .at-search:focus { outline:none; border-color:var(--sd-primary); }
        .at-select {
            padding:0.55rem 1rem; border:1.5px solid var(--sd-border); border-radius:var(--sd-radius-sm);
            font-family:inherit; font-size:0.82rem; background:var(--sd-surface); color:var(--sd-text); min-width:140px;
        }
        .at-btn-create {
            display:inline-flex; align-items:center; gap:0.4rem;
            padding:0.6rem 1.2rem; background:var(--sd-primary); color:white; border:none;
            border-radius:var(--sd-radius-sm); font-family:inherit; font-size:0.82rem; font-weight:700;
            cursor:pointer; transition:0.2s; text-decoration:none;
        }
        .at-btn-create:hover { opacity:0.9; color:white; }

        .at-grid { display:grid; grid-template-columns:repeat(auto-fill, minmax(280px, 1fr)); gap:1rem; }
        .at-card {
            background:var(--sd-surface); border:1.5px solid var(--sd-border); border-radius:var(--sd-radius);
            padding:1.25rem; transition:0.25s; animation:slideIn 0.3s ease-out; position:relative; display:flex; flex-direction:column;
        }
        .at-card:hover { border-color:var(--sd-primary); transform:translateY(-3px); box-shadow:var(--sd-shadow-sm); }
        .at-card-title { font-size:0.92rem; font-weight:800; color:var(--sd-text); margin-bottom:0.4rem; display:flex; justify-content:space-between; align-items:flex-start; gap:0.5rem; }
        .at-card-meta { font-size:0.72rem; color:var(--sd-text-3); margin-bottom:0.75rem; }
        .at-card-desc { font-size:0.78rem; color:var(--sd-text-2); line-height:1.5; margin-bottom:0.75rem; flex:1; }
        .at-card-stats { display:flex; gap:1.5rem; padding:0.75rem 0; border-top:1px solid var(--sd-border); border-bottom:1px solid var(--sd-border); margin-bottom:0.75rem; }
        .at-stat { text-align:center; }
        .at-stat-val { font-size:0.95rem; font-weight:800; color:var(--sd-text); }
        .at-stat-label { font-size:0.6rem; font-weight:700; color:var(--sd-text-3); text-transform:uppercase; letter-spacing:0.04em; }
        .at-badge {
            display:inline-flex; align-items:center; gap:0.2rem; padding:0.15rem 0.55rem;
            border-radius:50px; font-size:0.62rem; font-weight:800; text-transform:uppercase;
        }
        .at-badge-published { background:rgba(16,185,129,0.1); color:#10b981; }
        .at-badge-draft { background:rgba(79,70,229,0.1); color:#4f46e5; }
        .at-badge-archived { background:rgba(239,68,68,0.1); color:#ef4444; }
        .at-card-actions { display:flex; gap:0.5rem; }
        .at-action {
            padding:0.4rem 0.7rem; border:1.5px solid var(--sd-border); border-radius:var(--sd-radius-sm);
            font-family:inherit; font-size:0.72rem; font-weight:700; cursor:pointer; background:var(--sd-surface);
            color:var(--sd-text-2); transition:0.2s; text-decoration:none; display:inline-flex; align-items:center; gap:0.3rem;
        }
        .at-action:hover { border-color:var(--sd-primary); color:var(--sd-primary); }
        .at-action-danger { color:#ef4444; }
        .at-action-danger:hover { border-color:#ef4444; color:#ef4444; background:rgba(239,68,68,0.05); }

        .at-empty { text-align:center; padding:3rem; color:var(--sd-text-3); }
        .at-empty i { font-size:2rem; margin-bottom:0.75rem; display:block; }

        .at-pagination { display:flex; justify-content:center; gap:0.5rem; margin-top:1.5rem; }
        .at-page-btn {
            padding:0.45rem 0.85rem; border:1.5px solid var(--sd-border); border-radius:var(--sd-radius-sm);
            background:var(--sd-surface); font-family:inherit; font-size:0.8rem; font-weight:700;
            color:var(--sd-text-2); cursor:pointer; transition:0.2s;
        }
        .at-page-btn:hover:not(:disabled) { border-color:var(--sd-primary); color:var(--sd-primary); }
        .at-page-btn:disabled { opacity:0.4; cursor:default; }

        .at-toast {
            position:fixed; top:1rem; left:50%; transform:translateX(-50%); z-index:9999;
            padding:0.7rem 1.5rem; border-radius:var(--sd-radius-sm); font-size:0.82rem; font-weight:700;
            color:white; background:#10b981; box-shadow:0 4px 15px rgba(0,0,0,0.15); animation:fadeIn 0.3s;
        }
        .at-toast.error { background:#ef4444; }

        @media(max-width:700px) {
            .at-grid { grid-template-columns:1fr; }
            .at-card-stats { gap:1rem; }
        }
    </style>
</head>
<body class="sd-page">
<div class="sd-shell">
    <aside class="sd-sidebar" id="sidebar">
        <div class="sd-sidebar-brand">
            <div class="sd-brand-icon" style="background:linear-gradient(135deg,#4f46e5,#7c3aed);"><i class="fas fa-shield-alt"></i></div>
            <span class="sd-brand-text">Alpharia <span style="font-size:0.55rem;background:rgba(245,158,11,0.2);color:#f59e0b;padding:0.1rem 0.4rem;border-radius:4px;margin-left:0.3rem;font-weight:800;">ADMIN</span></span>
        </div>
        <nav class="sd-nav">
            <span class="sd-nav-section-label">Platform</span>
            <a href="admin-dashboard.html" class="sd-nav-link"><i class="fas fa-chart-pie"></i><span>Dashboard</span></a>
            <a href="admin-management.html" class="sd-nav-link"><i class="fas fa-users-cog"></i><span>Users & Schools</span></a>
            <a href="admin-tests.html" class="sd-nav-link active"><i class="fas fa-clipboard-list"></i><span>All Tests</span></a>
            <a href="admin-create-test.html" class="sd-nav-link"><i class="fas fa-plus-circle"></i><span>Create Test</span></a>
            <span class="sd-nav-section-label">Analytics</span>
            <a href="admin-reports.html" class="sd-nav-link"><i class="fas fa-chart-bar"></i><span>Reports</span></a>
            <span class="sd-nav-section-label">Account</span>
            <a href="admin-settings.html" class="sd-nav-link"><i class="fas fa-cog"></i><span>Settings</span></a>
        </nav>
        <div class="sd-sidebar-footer">
            <div class="sd-sidebar-user">
                <div class="sd-sidebar-user-info">
                    <div class="sd-sidebar-user-name" id="sidebar-admin-name">Loading…</div>
                    <div class="sd-sidebar-user-role">Platform Owner</div>
                </div>
                <button class="sd-icon-btn" id="logout-btn" title="Sign Out" style="margin-left:auto;color:var(--sd-text-3);"><i class="fas fa-sign-out-alt"></i></button>
            </div>
        </div>
    </aside>
    <div class="sd-sidebar-overlay" id="sidebar-overlay"></div>

    <div class="sd-main">
        <header class="sd-topbar">
            <button class="sd-topbar-toggle menu-toggle d-lg-none" id="sidebar-toggle"><i class="fas fa-bars"></i></button>
            <div style="font-weight:700; color:var(--sd-text);">All Tests</div>
            <div class="sd-topbar-actions"></div>
        </header>

        <main class="sd-body" style="animation:fadeIn 0.4s ease-out;">
            <div class="at-toolbar">
                <div class="at-search-wrap">
                    <i class="fas fa-search"></i>
                    <input type="text" class="at-search" id="searchInput" placeholder="Search tests…">
                </div>
                <select class="at-select" id="statusFilter">
                    <option value="">All Statuses</option>
                    <option value="draft">Draft</option>
                    <option value="published">Published</option>
                    <option value="archived">Archived</option>
                </select>
                <select class="at-select" id="sortBy">
                    <option value="newest">Newest First</option>
                    <option value="oldest">Oldest First</option>
                    <option value="name_asc">Name (A-Z)</option>
                    <option value="name_desc">Name (Z-A)</option>
                </select>
                <a href="admin-create-test.html" class="at-btn-create"><i class="fas fa-plus"></i> Create Test</a>
            </div>

            <div class="at-grid" id="testsContainer">
                <div class="at-empty"><i class="fas fa-spinner fa-spin"></i> Loading tests…</div>
            </div>

            <div class="at-pagination" id="pagination"></div>
        </main>
    </div>
</div>

<script type="module">
    import { app, auth, db } from './js/firebase-config.js';
    import { requireAuth } from './js/auth-check.js';
    import { collection, getDocs, query, orderBy, where, limit, startAfter, doc, deleteDoc, getDoc } from 'https://www.gstatic.com/firebasejs/12.1.0/firebase-firestore.js';
    import { signOut } from 'https://www.gstatic.com/firebasejs/12.1.0/firebase-auth.js';

    const testsContainer = document.getElementById('testsContainer');
    const searchInput = document.getElementById('searchInput');
    const statusFilter = document.getElementById('statusFilter');
    const sortBy = document.getElementById('sortBy');
    const pagination = document.getElementById('pagination');
    const itemsPerPage = 12;
    let currentPage = 1, lastVisible = null, hasMore = true, searchTerm = '';

    function initSidebar() {
        const sidebar = document.getElementById('sidebar');
        const toggle = document.getElementById('sidebar-toggle');
        const overlay = document.getElementById('sidebar-overlay');
        if (toggle && sidebar) toggle.addEventListener('click', () => {
            sidebar.classList.toggle('active'); sidebar.classList.toggle('open');
            overlay?.classList.toggle('active'); overlay?.classList.toggle('open');
        });
        if (overlay) overlay.addEventListener('click', () => {
            sidebar.classList.remove('active','open'); overlay.classList.remove('active','open');
        });
    }

    document.addEventListener('DOMContentLoaded', async () => {
        initSidebar();
        try {
            const { user } = await requireAuth(['admin', 'teacher']);
            let displayName = user.displayName || 'Administrator';
            try {
                const ud = await getDoc(doc(db, 'users', user.uid));
                if (ud.exists()) displayName = ud.data().name || ud.data().firstName || displayName;
            } catch(e){}
            document.getElementById('sidebar-admin-name').textContent = displayName;
            document.getElementById('logout-btn').addEventListener('click', () => signOut(auth).then(() => window.location.href = 'auth/login-fixed.html'));

            let timeout;
            searchInput.addEventListener('input', (e) => {
                clearTimeout(timeout);
                searchTerm = e.target.value.trim().toLowerCase();
                timeout = setTimeout(() => { currentPage = 1; lastVisible = null; loadTests(); }, 400);
            });
            statusFilter.addEventListener('change', () => { currentPage = 1; lastVisible = null; loadTests(); });
            sortBy.addEventListener('change', () => { currentPage = 1; lastVisible = null; loadTests(); });

            loadTests();
        } catch (e) { console.error(e); }
    });

    async function loadTests() {
        testsContainer.innerHTML = '<div class="at-empty"><i class="fas fa-spinner fa-spin"></i> Loading tests…</div>';
        try {
            const status = statusFilter.value;
            const sort = sortBy.value;
            let constraints = [];
            if (status) constraints.push(where('status', '==', status));
            switch (sort) {
                case 'newest': constraints.push(orderBy('createdAt', 'desc')); break;
                case 'oldest': constraints.push(orderBy('createdAt', 'asc')); break;
                case 'name_asc': constraints.push(orderBy('title', 'asc')); break;
                case 'name_desc': constraints.push(orderBy('title', 'desc')); break;
            }
            constraints.push(limit(itemsPerPage));
            if (lastVisible && currentPage > 1) constraints.push(startAfter(lastVisible));

            const q = query(collection(db, 'tests'), ...constraints);
            const snap = await getDocs(q);
            const tests = [];
            snap.forEach(d => tests.push({ id: d.id, ...d.data() }));

            if (snap.docs.length > 0) { lastVisible = snap.docs[snap.docs.length - 1]; hasMore = snap.docs.length === itemsPerPage; } else { hasMore = false; }

            const filtered = searchTerm
                ? tests.filter(t => (t.title||'').toLowerCase().includes(searchTerm) || (t.description||'').toLowerCase().includes(searchTerm))
                : tests;

            renderTests(filtered);
            renderPagination();
        } catch (e) {
            console.error(e);
            testsContainer.innerHTML = '<div class="at-empty" style="color:#ef4444;"><i class="fas fa-exclamation-triangle"></i> Error loading tests.</div>';
        }
    }

    function renderTests(tests) {
        if (tests.length === 0) {
            testsContainer.innerHTML = '<div class="at-empty"><i class="fas fa-clipboard-list"></i> No tests found. Create your first test!</div>';
            return;
        }
        testsContainer.innerHTML = tests.map(t => {
            const status = t.status || 'draft';
            const date = t.createdAt?.seconds ? new Date(t.createdAt.seconds * 1000).toLocaleDateString('en-US', { month:'short', day:'numeric', year:'numeric' }) : 'N/A';
            return `<div class="at-card" data-test-id="${t.id}">
                <div class="at-card-title">
                    <span>${t.title || 'Untitled'}</span>
                    <span class="at-badge at-badge-${status}"><i class="fas ${status==='published'?'fa-check-circle':status==='archived'?'fa-archive':'fa-edit'}"></i> ${status}</span>
                </div>
                <div class="at-card-meta"><i class="fas fa-user"></i> ${t.createdByName||'Admin'} · <i class="fas fa-calendar"></i> ${date}</div>
                ${t.description ? `<div class="at-card-desc">${t.description.substring(0,120)}${t.description.length>120?'…':''}</div>` : ''}
                <div class="at-card-stats">
                    <div class="at-stat"><div class="at-stat-val">${t.sections?t.sections.length:0}</div><div class="at-stat-label">Sections</div></div>
                    <div class="at-stat"><div class="at-stat-val">${t.totalQuestions||0}</div><div class="at-stat-label">Questions</div></div>
                    <div class="at-stat"><div class="at-stat-val">${t.attempts||0}</div><div class="at-stat-label">Attempts</div></div>
                </div>
                <div class="at-card-actions">
                    <a href="test-details.html?id=${t.id}" class="at-action"><i class="fas fa-eye"></i> View</a>
                    <a href="admin-edit-test.html?id=${t.id}" class="at-action"><i class="fas fa-pencil-alt"></i> Edit</a>
                    <button class="at-action at-action-danger" onclick="window.confirmDelete('${t.id}')" style="margin-left:auto;"><i class="fas fa-trash-alt"></i></button>
                </div>
            </div>`;
        }).join('');
    }

    function renderPagination() {
        pagination.innerHTML = `
            <button class="at-page-btn" ${currentPage===1?'disabled':''} id="prev-page"><i class="fas fa-chevron-left"></i></button>
            <button class="at-page-btn" ${!hasMore?'disabled':''} id="next-page"><i class="fas fa-chevron-right"></i></button>`;
        document.getElementById('prev-page')?.addEventListener('click', () => { if (currentPage > 1) { currentPage--; loadTests(); } });
        document.getElementById('next-page')?.addEventListener('click', () => { if (hasMore) { currentPage++; loadTests(); } });
    }

    window.confirmDelete = async function(testId) {
        if (!confirm('Delete this test? This cannot be undone.')) return;
        try {
            const card = document.querySelector(`[data-test-id="${testId}"]`);
            if (card) { card.style.opacity = '0.4'; card.style.pointerEvents = 'none'; }
            await deleteDoc(doc(db, 'tests', testId));
            showToast('Test deleted successfully!');
            await loadTests();
        } catch (e) {
            console.error(e);
            showToast('Failed to delete test.', true);
            const card = document.querySelector(`[data-test-id="${testId}"]`);
            if (card) { card.style.opacity = '1'; card.style.pointerEvents = 'auto'; }
        }
    };

    function showToast(msg, isError) {
        const el = document.createElement('div');
        el.className = `at-toast${isError?' error':''}`;
        el.textContent = msg;
        document.body.appendChild(el);
        setTimeout(() => el.remove(), 3000);
    }
</script>
</body>
</html>
