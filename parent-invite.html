<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Link Child Account - Alpharia</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="css/student-dashboard-clean.css">
    
    <style>
        .invite-container {
            max-width: 500px;
            margin: 4rem auto;
            background: var(--sd-surface);
            border: 1.5px solid var(--sd-border);
            border-radius: var(--sd-radius);
            padding: 2.5rem;
            text-align: center;
        }
        .invite-icon {
            font-size: 3rem;
            color: var(--sd-primary);
            margin-bottom: 1.5rem;
        }
        .invite-h1 {
            font-size: 1.5rem;
            font-weight: 800;
            color: var(--sd-text);
            margin-bottom: 0.5rem;
        }
        .invite-sub {
            color: var(--sd-text-2);
            margin-bottom: 2rem;
            line-height: 1.5;
        }
        .code-input-group {
            display: flex;
            flex-direction: column;
            gap: 1rem;
            margin-bottom: 2rem;
        }
        .code-input {
            width: 100%;
            padding: 1rem;
            font-size: 1.25rem;
            text-align: center;
            border: 2px solid var(--sd-border);
            border-radius: var(--sd-radius-sm);
            background: var(--sd-surface-2);
            color: var(--sd-text);
            letter-spacing: 0.2em;
            text-transform: uppercase;
        }
        .code-input:focus {
            outline: none;
            border-color: var(--sd-primary);
            box-shadow: 0 0 0 4px var(--sd-primary-lt);
        }
        #error-msg {
            color: #ef4444;
            font-size: 0.85rem;
            font-weight: 600;
            margin-top: 0.5rem;
            display: none;
        }
    </style>
</head>

<body class="sd-page" style="display: flex; flex-direction: column; min-height: 100vh;">

    <!-- Minimal Header -->
    <header style="padding: 1rem 2rem; border-bottom: 1px solid var(--sd-border); background: var(--sd-surface);">
        <a href="parent-dashboard.html" style="text-decoration:none; display:flex; align-items:center; gap:0.5rem; color:var(--sd-text); font-weight:700;">
            <i class="fas fa-arrow-left"></i> Back to Dashboard
        </a>
    </header>

    <div class="invite-container">
        <div class="invite-icon"><i class="fas fa-link"></i></div>
        <h1 class="invite-h1">Link Your Child's Account</h1>
        <p class="invite-sub">Enter the unique 6-character code provided by your child's teacher to view their reading progress.</p>
        
        <div class="code-input-group">
            <input type="text" id="invite-code" class="code-input" placeholder="e.g. A1B2C3" maxlength="6">
            <div id="error-msg">Invalid invite code. Please try again.</div>
        </div>
        
        <button id="submit-btn" class="sd-btn sd-btn-primary" style="width:100%; padding: 1rem;">Link Account</button>
    </div>

    <script type="module">
        import { db, auth } from './js/firebase-config.js';
        import { collection, query, where, getDocs, doc, updateDoc } from 'https://www.gstatic.com/firebasejs/12.1.0/firebase-firestore.js';

        document.getElementById('submit-btn').addEventListener('click', async () => {
            const codeInput = document.getElementById('invite-code').value.trim().toUpperCase();
            const errorMsg = document.getElementById('error-msg');
            const submitBtn = document.getElementById('submit-btn');

            if (codeInput.length < 5) {
                errorMsg.textContent = "Please enter a valid code.";
                errorMsg.style.display = 'block';
                return;
            }

            try {
                submitBtn.disabled = true;
                submitBtn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Linking...';
                errorMsg.style.display = 'none';

                const user = auth.currentUser;
                if (!user) throw new Error("Must be logged in.");

                // Search for the student by their invite code
                // Note: Assumes `parentInviteCode` exists on student docs in Firestore
                const q = query(collection(db, 'students'), where('parentInviteCode', '==', codeInput));
                const snap = await getDocs(q);

                if (snap.empty) {
                    errorMsg.textContent = "Invalid or expired code.";
                    errorMsg.style.display = 'block';
                } else {
                    // Code found! Link the student to this parent
                    const studentDocRef = snap.docs[0].ref;
                    await updateDoc(studentDocRef, {
                        parentId: user.uid,
                        parentInviteCode: null // Consume the code so it can't be reused
                    });

                    // Redirect back to dashboard
                    window.location.href = 'parent-dashboard.html';
                }
            } catch (e) {
                console.error("Linking error:", e);
                errorMsg.textContent = "An error occurred. Please try again.";
                errorMsg.style.display = 'block';
            } finally {
                submitBtn.disabled = false;
                submitBtn.innerHTML = 'Link Account';
            }
        });
    </script>
</body>
</html>
