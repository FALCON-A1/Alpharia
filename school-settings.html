<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>School Settings - Alpharia</title>

    <!-- Fonts & Icons -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <!-- Design System CSS -->
    <link rel="stylesheet" href="css/student-dashboard-clean.css">
    <link rel="stylesheet" href="css/teacher-dashboard-clean.css">

    <style>
        .settings-layout {
            display: grid;
            grid-template-columns: 300px 1fr;
            gap: 2rem;
            align-items: start;
        }
        @media (max-width: 900px) {
            .settings-layout { grid-template-columns: 1fr; }
        }

        .settings-nav {
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
        }
        .settings-nav-item {
            padding: 1rem;
            border-radius: var(--sd-radius-sm);
            color: var(--sd-text-2);
            font-weight: 600;
            cursor: pointer;
            transition: var(--sd-transition);
            display: flex;
            align-items: center;
            gap: 0.75rem;
        }
        .settings-nav-item:hover { background: var(--sd-surface-2); color: var(--sd-text); }
        .settings-nav-item.active { background: var(--sd-primary-lt); color: var(--sd-primary); }

        .form-card {
            background: var(--sd-surface);
            border: 1.5px solid var(--sd-border);
            border-radius: var(--sd-radius);
            padding: 1.5rem;
        }
    </style>
</head>

<body class="sd-page">

<div class="sd-shell">
    <!-- ═══════════ SIDEBAR ═══════════ -->
    <aside class="sd-sidebar" id="sidebar">
        <div class="sd-sidebar-brand">
            <div class="sd-brand-icon" style="background: var(--sd-primary);"><i class="fas fa-university"></i></div>
            <span class="sd-brand-text">Alpharia Admin</span>
        </div>

        <nav class="sd-nav">
            <span class="sd-nav-section-label">Institutional</span>
            <a href="school-dashboard.html" class="sd-nav-link"><i class="fas fa-chart-pie"></i><span>Overview</span></a>
            <a href="#" class="sd-nav-link"><i class="fas fa-chalkboard-teacher"></i><span>Staff Directory</span></a>
            <a href="#" class="sd-nav-link"><i class="fas fa-users"></i><span>Students</span></a>
            
            <span class="sd-nav-section-label">Account</span>
            <a href="school-settings.html" class="sd-nav-link active"><i class="fas fa-cog"></i><span>School Settings</span></a>
        </nav>

        <div class="sd-sidebar-footer">
            <div class="sd-sidebar-user">
                <div class="sd-sidebar-user-info">
                    <div class="sd-sidebar-user-name" id="admin-name-sidebar">Loading…</div>
                    <div class="sd-sidebar-user-role">School Administrator</div>
                </div>
                <button class="sd-icon-btn" id="logout-btn" title="Sign Out" style="margin-left:auto; color:var(--sd-text-3);">
                    <i class="fas fa-sign-out-alt"></i>
                </button>
            </div>
        </div>
    </aside>

    <div class="sd-sidebar-overlay" id="sidebar-overlay"></div>

    <!-- ═══════════ MAIN ═══════════ -->
    <div class="sd-main">
        <header class="sd-topbar">
            <button class="sd-topbar-toggle menu-toggle d-lg-none" id="sidebar-toggle"><i class="fas fa-bars"></i></button>
            <div style="font-weight: 700;">School Management</div>
            <div class="sd-topbar-actions">
                <button class="sd-btn sd-btn-primary" id="save-settings-btn"><i class="fas fa-save"></i> Save Changes</button>
            </div>
        </header>

        <main class="sd-body" style="animation: fadeIn 0.4s ease-out;">
            <div class="settings-layout">
                <!-- Navigation -->
                <div class="settings-nav">
                    <div class="settings-nav-item active"><i class="fas fa-building"></i> Institution Profile</div>
                    <div class="settings-nav-item"><i class="fas fa-shield-alt"></i> Permissions</div>
                    <div class="settings-nav-item"><i class="fas fa-bell"></i> Notifications</div>
                </div>

                <!-- Content -->
                <div class="form-card">
                    <h3 style="margin-top: 0; margin-bottom: 2rem; font-weight: 800; color: var(--sd-text);">Institution Profile</h3>
                    
                    <div class="td-form-group">
                        <label class="td-form-label">Institution Name</label>
                        <input type="text" class="td-form-input" id="schoolName" value="Greenwood Academy">
                    </div>

                    <div class="td-form-row">
                        <div class="td-form-group">
                            <label class="td-form-label">School ID</label>
                            <input type="text" class="td-form-input" id="schoolIdDisplay" value="SCH-9982" disabled>
                        </div>
                        <div class="td-form-group">
                            <label class="td-form-label">Region / State</label>
                            <input type="text" class="td-form-input" id="schoolRegion" value="California">
                        </div>
                    </div>

                    <div class="td-form-group">
                        <label class="td-form-label">Official Website</label>
                        <input type="url" class="td-form-input" id="schoolWebsite" placeholder="https://www.greenwood.edu">
                    </div>

                    <div class="td-form-group">
                        <label class="td-form-label">Admin Contact Email</label>
                        <input type="email" class="td-form-input" id="adminEmail" disabled>
                    </div>

                    <hr style="border: none; border-top: 1px solid var(--sd-border); margin: 2rem 0;">

                    <h3 style="font-weight: 800; color: var(--sd-text);">Branding</h3>
                    <div style="display: flex; align-items: center; gap: 2rem;">
                        <img id="schoolLogo" src="https://ui-avatars.com/api/?name=Greenwood&background=1e293b&color=fff&size=128" alt="Logo" style="width: 100px; height: 100px; border-radius: 12px; border: 1.5px solid var(--sd-border);">
                        <div>
                            <button class="sd-btn sd-btn-outline">Upload New Logo</button>
                            <p style="font-size: 0.75rem; color: var(--sd-text-3); margin-top: 0.5rem;">Recommended size: 512x512px. PNG or JPG.</p>
                        </div>
                    </div>
                </div>
            </div>
        </main>
    </div>
</div>

<script type="module">
    import { auth, db } from './js/firebase-config.js';
    import { requireAuth } from './js/auth-check.js';
    import { doc, getDoc, updateDoc } from 'https://www.gstatic.com/firebasejs/12.1.0/firebase-firestore.js';
    import { signOut } from 'https://www.gstatic.com/firebasejs/12.1.0/firebase-auth.js';

    document.addEventListener('DOMContentLoaded', async () => {
        const sidebar = document.getElementById('sidebar');
        const toggle = document.getElementById('sidebar-toggle');
        if (toggle && sidebar) toggle.addEventListener('click', () => sidebar.classList.toggle('active'));

        try {
            const { user } = await requireAuth(['school_admin', 'admin']);
            
            const adminDoc = await getDoc(doc(db, 'users', user.uid));
            if (adminDoc.exists()) {
                const data = adminDoc.data();
                document.getElementById('admin-name-sidebar').textContent = data.name || 'Admin';
                document.getElementById('adminEmail').value = user.email;
                if (data.schoolName) document.getElementById('schoolName').value = data.schoolName;
                if (data.schoolId) document.getElementById('schoolIdDisplay').value = data.schoolId;
                if (data.schoolRegion) document.getElementById('schoolRegion').value = data.schoolRegion;
            }

            document.getElementById('save-settings-btn').addEventListener('click', async () => {
                const update = {
                    schoolName: document.getElementById('schoolName').value,
                    schoolRegion: document.getElementById('schoolRegion').value,
                    schoolWebsite: document.getElementById('schoolWebsite').value
                };
                try {
                    await updateDoc(doc(db, 'users', user.uid), update);
                    alert("Settings saved!");
                } catch (e) { alert("Error saving settings."); }
            });

            document.getElementById('logout-btn').addEventListener('click', () => {
                signOut(auth).then(() => window.location.href = 'auth/login-fixed.html');
            });
        } catch (e) {
            console.error(e);
        }
    });
</script>
</body>
</html>
