    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="css/student-dashboard-clean.css">
    <link rel="stylesheet" href="css/teacher-dashboard-clean.css">

    <style>
        /* ========== Bridge old CSS variables to design system ========== */
        :root {
            --primary: #4f46e5;
            --primary-dark: #4338ca;
            --primary-light: rgba(79,70,229,0.08);
            --success: #10b981;
            --danger: #ef4444;
            --warning-color: #f59e0b;
            --text-color: #1e293b;
            --text-muted: #94a3b8;
            --border-color: #e2e8f0;
            --bg-white: #fff;
            --bg-light: #f8fafc;
            --border-radius: 12px;
            --border-radius-sm: 8px;
            --shadow-lg: 0 8px 24px rgba(0,0,0,0.08);
            --transition: 0.25s ease;
        }

        /* ========== Shell overrides ========== */
        .sd-body { padding-bottom: 3rem; }
        .test-creator-container { max-width: 920px; padding: 1.5rem 2rem; }

        /* ========== Cards ========== */
        .card {
            background: #fff;
            border: 1.5px solid var(--border-color);
            border-radius: var(--border-radius);
            box-shadow: 0 1px 4px rgba(0,0,0,0.04);
            margin-bottom: 1.5rem;
            overflow: hidden;
        }
        .card-header {
            padding: 1rem 1.5rem;
            border-bottom: 1px solid var(--border-color);
            background: linear-gradient(135deg, #f8fafc, #f1f5f9);
        }
        .card-header h3 {
            margin: 0; font-size: 0.95rem; font-weight: 800; color: var(--text-color);
            display: flex; align-items: center; gap: 0.5rem;
        }
        .card-header h3 i { color: var(--primary); font-size: 1rem; }
        .card-body { padding: 1.5rem; }

        /* ========== Form elements with great contrast ========== */
        .form-group { margin-bottom: 1.25rem; }
        .form-group label {
            display: block; margin-bottom: 0.45rem;
            font-size: 0.82rem; font-weight: 700; color: #334155;
        }
        .form-control {
            width: 100%; padding: 0.65rem 1rem;
            border: 1.5px solid #cbd5e1;
            border-radius: 8px; font-family: 'Inter', sans-serif;
            font-size: 0.88rem; color: #1e293b;
            background: #fff; transition: 0.2s;
            box-sizing: border-box;
        }
        .form-control:focus {
            outline: none; border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(79,70,229,0.12);
        }
        .form-control::placeholder { color: #94a3b8; }
        select.form-control { cursor: pointer; }
        textarea.form-control { resize: vertical; min-height: 60px; }

        .form-row { display: flex; gap: 1.25rem; margin-bottom: 1.25rem; }
        .form-row .form-group { flex: 1; margin-bottom: 0; }

        /* ========== Section Cards (cloned from templates) ========== */
        .section-card {
            border: 1.5px solid #c7d2fe;
            background: #fff;
            border-radius: var(--border-radius);
            margin-bottom: 1.5rem;
            box-shadow: 0 2px 8px rgba(79,70,229,0.06);
        }
        .section-card .card-header {
            background: linear-gradient(135deg, #eef2ff, #e0e7ff);
            border-bottom: 1px solid #c7d2fe;
        }
        .section-header {
            display: flex; justify-content: space-between; align-items: center;
        }
        .section-title {
            margin: 0; font-size: 1rem; font-weight: 800;
            color: #312e81;
        }
        .section-actions { display: flex; gap: 0.35rem; }

        /* ========== Item Cards ========== */
        .item-card {
            background: #f8fafc;
            border: 1.5px solid #e2e8f0;
            border-radius: 8px; padding: 1rem;
            margin-bottom: 0.75rem;
            display: flex; align-items: flex-start; gap: 1rem;
            transition: 0.2s;
        }
        .item-card:hover { border-color: #c7d2fe; background: #fafaff; }
        .item-content { flex: 1; display: flex; gap: 0.75rem; flex-wrap: wrap; }
        .item-content .form-group { flex: 1; min-width: 140px; margin-bottom: 0; }
        .item-actions { display: flex; gap: 0.25rem; flex-shrink: 0; }

        /* ========== Buttons ========== */
        .btn {
            display: inline-flex; align-items: center; justify-content: center;
            padding: 0.55rem 1.1rem; border-radius: 8px;
            font-family: 'Inter', sans-serif; font-weight: 700; font-size: 0.82rem;
            cursor: pointer; transition: 0.2s; border: 1.5px solid transparent;
            gap: 0.4rem;
        }
        .btn i { font-size: 0.78rem; }

        .btn-sm { padding: 0.3rem 0.6rem; font-size: 0.75rem; }
        .btn-icon {
            width: 32px; height: 32px; padding: 0;
            border-radius: 50%; display: inline-flex;
            align-items: center; justify-content: center;
            background: #f1f5f9; color: #64748b;
            border: 1.5px solid #e2e8f0;
        }
        .btn-icon:hover { background: #e2e8f0; color: #334155; }

        .btn-primary {
            background: var(--primary); color: #fff;
            border-color: var(--primary);
            box-shadow: 0 2px 6px rgba(79,70,229,0.25);
        }
        .btn-primary:hover { background: var(--primary-dark); border-color: var(--primary-dark); }

        .btn-outline, .btn-outline-secondary {
            background: #fff; border-color: #cbd5e1; color: #475569;
        }
        .btn-outline:hover, .btn-outline-secondary:hover {
            border-color: var(--primary); color: var(--primary); background: #f8fafc;
        }

        .btn-secondary {
            background: #f1f5f9; color: #475569; border-color: #cbd5e1;
        }
        .btn-secondary:hover { background: #e2e8f0; border-color: #94a3b8; }

        .btn-success {
            background: var(--success); color: #fff;
            border-color: var(--success);
            box-shadow: 0 2px 6px rgba(16,185,129,0.25);
        }
        .btn-success:hover { background: #059669; border-color: #059669; }

        .btn-danger { background: var(--danger); color: #fff; border-color: var(--danger); }
        .btn-danger:hover { background: #dc2626; border-color: #dc2626; }

        .text-center { text-align: center; margin: 1.25rem 0; }

        /* ========== Add Section Button — prominent ========== */
        #add-section-btn {
            padding: 0.65rem 1.8rem; font-size: 0.88rem;
            box-shadow: 0 3px 10px rgba(79,70,229,0.2);
        }

        /* ========== Form Actions ========== */
        .form-actions {
            display: flex; justify-content: space-between; align-items: center;
            margin-top: 1.5rem; padding: 1.25rem 0 0;
            border-top: 1.5px solid var(--border-color);
            flex-wrap: wrap; gap: 0.75rem;
        }
        .draft-buttons, .action-buttons { display: flex; gap: 0.65rem; }

        /* ========== Publish Modal ========== */
        .publish-modal {
            display: none; position: fixed; z-index: 2000;
            left: 0; top: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.5);
            justify-content: center; align-items: center;
        }
        .publish-modal.show { display: flex; }
        .publish-modal-content {
            background: #fff; border-radius: 16px; padding: 2rem;
            text-align: center; max-width: 420px; width: 90%;
            box-shadow: 0 12px 40px rgba(0,0,0,0.15);
        }
        .publish-icon { font-size: 2.5rem; color: var(--primary); margin-bottom: 1rem; }
        .publish-status { color: #475569; font-size: 0.88rem; margin: 0.75rem 0; }
        .publish-progress { height: 6px; background: #e2e8f0; border-radius: 3px; margin: 1rem 0; overflow: hidden; }
        .publish-progress-bar { height: 100%; background: var(--primary); border-radius: 3px; width: 0%; transition: 0.4s; }
        .publish-details { font-size: 0.78rem; color: #94a3b8; }
        .mt-3 { margin-top: 1rem; }

        /* ========== Drafts Modal ========== */
        .modal { display:none; position:fixed; z-index:1000; left:0; top:0; width:100%; height:100%; background-color:rgba(0,0,0,0.5); }
        .modal-content { background:#fff; margin:5% auto; padding:1.5rem; border-radius:16px; width:80%; max-width:700px; max-height:80vh; display:flex; flex-direction:column; border:1.5px solid var(--border-color); box-shadow: 0 12px 40px rgba(0,0,0,0.12); }
        .modal-header { display:flex; justify-content:space-between; align-items:center; margin-bottom:1rem; padding-bottom:0.75rem; border-bottom:1px solid var(--border-color); }
        .modal-header h3 { margin:0; color:var(--text-color); font-size:1rem; font-weight:800; display:flex; align-items:center; gap:0.5rem; }
        .modal-header .close { font-size:24px; cursor:pointer; color:#94a3b8; transition:0.2s; }
        .modal-header .close:hover { color:var(--text-color); }
        .modal-body { flex:1; overflow-y:auto; padding:0.5rem 0; }
        .modal-footer { display:flex; justify-content:flex-end; padding-top:1rem; border-top:1px solid var(--border-color); }
        .drafts-list { margin-top:0.75rem; }
        .draft-item { padding:0.85rem 1rem; border:1.5px solid var(--border-color); border-radius:8px; margin-bottom:0.75rem; cursor:pointer; transition:0.2s; }
        .draft-item:hover { background:#f8fafc; border-color:var(--primary); }
        .draft-item h4 { margin:0 0 4px 0; color:var(--text-color); font-size:0.88rem; font-weight:700; }
        .draft-meta { display:flex; justify-content:space-between; color:#94a3b8; font-size:0.78rem; }
        .loading-drafts { text-align:center; padding:1.5rem; color:#94a3b8; }
        .search-box { margin-bottom:0.75rem; }
        .no-drafts { text-align:center; padding:2rem; color:#94a3b8; font-size:0.88rem; }
        .error-loading { text-align:center; padding:2rem; color:var(--danger); }

        /* ========== Notification toast ========== */
        .notification {
            position:fixed; top:1rem; left:50%; transform:translateX(-50%);
            z-index:9999; padding:0.7rem 1.5rem; border-radius:8px;
            font-size:0.82rem; font-weight:700; color:white; background:var(--success);
            box-shadow: 0 4px 15px rgba(0,0,0,0.12); animation:fadeIn 0.3s;
        }
        .notification.error { background:var(--danger); }
        .notification.info { background:#3b82f6; }
        @keyframes fadeIn { from{opacity:0;transform:translateX(-50%) translateY(-10px)}to{opacity:1;transform:translateX(-50%) translateY(0)} }

        /* ========== Responsive ========== */
        @media (max-width: 700px) {
            .test-creator-container { padding: 1rem; }
            .form-row { flex-direction: column; gap: 0; }
            .form-actions { flex-direction: column; align-items: stretch; }
            .draft-buttons, .action-buttons { flex-direction: column; }
            .item-card { flex-direction: column; }
            .item-content { flex-direction: column; }
        }
    </style>
</head>

<body class="sd-page">
<div class="sd-shell">
    <aside class="sd-sidebar" id="sidebar">
        <div class="sd-sidebar-brand">

    <div class="sd-main">
        <header class="sd-topbar">

            <div style="font-weight:700; color:var(--sd-text);">Create New Reading Test</div>
            <div class="sd-topbar-actions"></div>
        </header>

    <main class="sd-body">

        <div class="test-creator-container">
            <!-- Test Info Section -->
            <div class="card">
                <div class="card-header">
                    <h3><i class="fas fa-info-circle"></i> Test Information</h3>
                </div>
                <div class="card-body">
                    <div class="form-group">
                        <label for="test-title">Test Title</label>
                        <input type="text" id="test-title" class="form-control" placeholder="Enter test title" required>
                    </div>
                    <div class="form-row">
                        <div class="form-group">
                            <label for="test-grade">Grade Level</label>
                            <select id="test-grade" class="form-control" required>
                                <option value="">Select grade</option>
                                <option value="1">Grade 1</option>
                                <option value="2">Grade 2</option>
                                <option value="3">Grade 3</option>
                                <option value="4">Grade 4</option>
                                <option value="5">Grade 5</option>
                                <option value="6">Grade 6</option>
                                <option value="7">Grade 7</option>
                                <option value="8">Grade 8</option>
                                <option value="9">Grade 9</option>
                                <option value="10">Grade 10</option>
                                <option value="11">Grade 11</option>
                                <option value="12">Grade 12</option>
                            </select>
                        </div>
                        <div class="form-group">
                            <label for="test-time-limit">Time Limit (minutes)</label>
                            <input type="number" id="test-time-limit" class="form-control" min="1" value="30">
                        </div>
                    </div>
                    <div class="form-group">
                        <label for="test-instructions">Instructions (Optional)</label>
                        <textarea id="test-instructions" class="form-control" rows="3"
                            placeholder="Enter test instructions"></textarea>
                    </div>
                </div>
            </div>

            <!-- Sections Container -->
            <div id="sections-container" class="sections-container">
                <!-- Sections will be added here dynamically -->
            </div>

            <!-- Add Section Button -->
            <div class="text-center">
                <button type="button" class="btn btn-primary" id="add-section-btn">
                    <i class="fas fa-plus-circle"></i> Add Section
                </button>
            </div>

            <!-- Save & Preview Buttons -->
            <div class="form-actions">
                <div class="draft-buttons">
                    <button type="button" class="btn btn-secondary" id="load-draft-btn">
                        <i class="fas fa-folder-open"></i> Load Draft
                    </button>
                    <button type="button" class="btn btn-outline-secondary" id="save-draft-btn">
                        <i class="fas fa-save"></i> Save as Draft
                    </button>
                </div>
                <div class="action-buttons">
                    <button type="button" class="btn btn-outline-secondary" id="preview-test-btn">
                        <i class="fas fa-eye"></i> Preview
                    </button>
                    <button type="button" class="btn btn-success" id="publish-test-btn">
                        <i class="fas fa-paper-plane"></i> Publish Test
                    </button>
                </div>
            </div>
        </div>
    </main>
    </div>
</div>

    <!-- Drafts Modal -->
    <div id="draftsModal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h3><i class="fas fa-folder-open"></i> Load Draft Test</h3>
                <span class="close">&times;</span>
            </div>
            <div class="modal-body">
                <div class="search-box">
                    <input type="text" id="draftSearch" placeholder="Search drafts..." class="form-control">
                </div>
                <div class="drafts-list" id="draftsList">
                    <div class="loading-drafts">
                        <i class="fas fa-spinner fa-spin"></i> Loading drafts...
                    </div>
                </div>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-secondary" id="cancelDraftLoad">Cancel</button>
            </div>
        </div>
    </div>

    <!-- Publish Modal -->
    <div id="publishModal" class="publish-modal">
        <div class="publish-modal-content">
            <div class="publish-icon">
                <i class="fas fa-spinner fa-spin"></i>
            </div>
            <h3 id="publishTitle">Publishing Test</h3>
            <div class="publish-status" id="publishStatus">Preparing your test...</div>
            <div class="publish-progress">
                <div class="publish-progress-bar" id="publishProgress"></div>
            </div>
            <div class="publish-details" id="publishDetails">This may take a few moments</div>
            <button id="publishCloseBtn" class="btn btn-primary mt-3" style="display: none;">Close</button>
        </div>
    </div>

    <!-- Section Template (Hidden) -->
    <template id="section-template">
        <div class="card section-card" data-section-id="">
            <div class="card-header">
                <div class="section-header">
                    <h3 class="section-title">New Section</h3>
                    <div class="section-actions">
                        <button class="btn btn-sm btn-icon move-section-up" title="Move Up">
                            <i class="fas fa-arrow-up"></i>
                        </button>
                        <button class="btn btn-sm btn-icon move-section-down" title="Move Down">
                            <i class="fas fa-arrow-down"></i>
                        </button>
                        <button class="btn btn-sm btn-icon delete-section" title="Delete Section">
                            <i class="fas fa-trash"></i>
                        </button>
                    </div>
                </div>
            </div>
            <div class="card-body">
                <div class="form-group">
                    <label>Section Title</label>
                    <input type="text" class="form-control section-title-input" placeholder="Enter section title"
                        required>
                </div>
                <div class="form-group">
                    <label>Instructions (Optional)</label>
                    <textarea class="form-control section-instructions" rows="2"
                        placeholder="Enter section instructions"></textarea>
                </div>
                <div class="form-group">
                    <label>Section Type</label>
                    <select class="form-control section-type" required>
                        <option value="letters">Letters</option>
                        <option value="words">Words</option>
                        <option value="sentences">Sentences</option>
                        <option value="passage">Reading Passage</option>
                    </select>
                </div>

                <!-- Items Container -->
                <div class="items-container">
                    <!-- Items will be added here dynamically -->
                </div>

                <!-- Add Item Button -->
                <button class="btn btn-outline btn-sm add-item-btn">
                    <i class="fas fa-plus"></i> Add Item
                </button>
            </div>
        </div>
    </template>

    <!-- Word Item Template -->
    <template id="word-item-template">
        <div class="item-card" data-item-type="word" data-item-id="">
            <div class="item-content">
                <div class="form-group">
                    <label>Word</label>
                    <input type="text" class="form-control item-text" placeholder="Enter word" required>
                </div>
                <div class="form-group">
                    <label>Points</label>
                    <input type="number" class="form-control item-points" min="1" value="1" required>
                </div>

                <button type="button" class="btn btn-sm btn-icon move-item-up" title="Move Up">
                    <i class="fas fa-arrow-up"></i>
                </button>
                <button type="button" class="btn btn-sm btn-icon move-item-down" title="Move Down">
                    <i class="fas fa-arrow-down"></i>
                </button>
                <button type="button" class="btn btn-sm btn-icon delete-item" title="Delete">

                </button>
            </div>
        </div>
    </template>

    <!-- Letter Item Template -->

        <div class="item-card" data-item-type="letter" data-item-id="">
            <div class="item-content">
                <div class="form-group">
                    <label>Letter</label>
                    <input type="text" class="form-control item-text" placeholder="Enter letter" maxlength="1" required>
                </div>
                <div class="form-group">
                    <label>Example Word</label>
                    <input type="text" class="form-control item-example" placeholder="Example word with this letter">
                </div>
                <div class="form-group">
                    <label>Points</label>
                    <input type="number" class="form-control item-points" min="1" value="1" required>
                </div>
            </div>
            <div class="item-actions">
                <button type="button" class="btn btn-sm btn-icon move-item-up" title="Move Up">
                    <i class="fas fa-arrow-up"></i>
                </button>
                <button type="button" class="btn btn-sm btn-icon move-item-down" title="Move Down">
                    <i class="fas fa-arrow-down"></i>
                </button>
                <button type="button" class="btn btn-sm btn-icon delete-item" title="Delete">
                    <i class="fas fa-times"></i>
                </button>
            </div>
        </div>
    </template>

    <!-- Sentence Item Template -->
    <template id="sentence-item-template">
        <div class="item-card" data-item-type="sentence" data-item-id="">
            <div class="item-content">
                <div class="form-group">
                    <label>Sentence</label>
                    <textarea class="form-control item-text" rows="2" placeholder="Enter sentence" required></textarea>
                </div>
                <div class="form-group">
                    <label>Focus Word</label>
                    <input type="text" class="form-control item-focus" placeholder="Word to focus on (optional)">
                </div>
                <div class="form-group">
                    <label>Points</label>
                    <input type="number" class="form-control item-points" min="1" value="2" required>
                </div>
            </div>
            <div class="item-actions">
                <button type="button" class="btn btn-sm btn-icon move-item-up" title="Move Up">
                    <i class="fas fa-arrow-up"></i>
                </button>
                <button type="button" class="btn btn-sm btn-icon move-item-down" title="Move Down">
                    <i class="fas fa-arrow-down"></i>
                </button>
                <button type="button" class="btn btn-sm btn-icon delete-item" title="Delete">
                    <i class="fas fa-times"></i>
                </button>
            </div>
        </div>

        async function initApp() {
            try {

        // Initialize functionality for a section
        function initSectionFunctionality(section) {
            if (!section) {
                console.error('No section provided');

            if (addItemBtn) {

            // Section type change handler
            const sectionType = section.querySelector('.section-type');
            if (sectionType) {
                sectionType.addEventListener('change', (e) => {
                    const itemsContainer = section.querySelector('.items-container');
                    if (itemsContainer) {
                        // Clear existing items when section type changes
                        itemsContainer.innerHTML = '';
                        // Add a new item of the selected type
                        addNewItem(section);
                    }
                });
            }

            // Move up/down buttons
            const moveUpBtn = section.querySelector('.move-section-up');
            const moveDownBtn = section.querySelector('.move-section-down');

            if (moveUpBtn) {
                moveUpBtn.addEventListener('click', () => {
                    const prev = section.previousElementSibling;
                    if (prev && prev !== sectionsContainer.firstElementChild) {
                        sectionsContainer.insertBefore(section, prev);
                    }
                });
            }

            if (moveDownBtn) {
                moveDownBtn.addEventListener('click', () => {
                    const next = section.nextElementSibling;
                    if (next) {
                        sectionsContainer.insertBefore(next, section);
                    }
                });
            }
        }

        // Save the test as a draft
        async function saveAsDraft() {
            try {
                console.log('=== Starting saveAsDraft() ===');

                // 1. Get test data
                console.log('1. Getting test data...');
                const testData = getTestData();
                console.log('Test data retrieved:', JSON.stringify(testData, null, 2));

                if (!testData) {
                    throw new Error('No test data available to save');
                }

                // 2. Add draft-specific metadata
                console.log('2. Adding metadata...');
                const timestamp = serverTimestamp();
                const user = auth.currentUser;

                if (!user) {
                    throw new Error('User not authenticated');
                }

                // Add metadata
                const draftData = {
                    ...testData,
                    status: 'draft',
                    isDraft: true,
                    teacherId: user.uid,
                    teacherEmail: user.email,
                    createdAt: timestamp,
                    updatedAt: timestamp,
                    // Add any additional fields that might be required
                    userType: 'teacher',
                    createdByEmail: user.email,
                    lastModified: timestamp
                };

                console.log('3. Final draft data with metadata:', JSON.stringify(draftData, null, 2));

                // 3. Save to Firestore
                console.log('4. Saving to Firestore...');
                console.log('Database instance:', db ? 'Available' : 'Undefined');

                if (!db) {
                    throw new Error('Firestore database not initialized');
                }

                // Log available collections (for debugging)
                console.log('5. Attempting to save to draftTests collection...');

                // Save the document
                const docRef = await addDoc(collection(db, 'draftTests'), draftData);

                if (!docRef?.id) {
                    throw new Error('Failed to get document reference after save');
                }

                console.log('6. Draft saved successfully with ID:', docRef.id);
                showNotification('Draft saved successfully!', 'success');

                return docRef.id;

            } catch (error) {
                console.error('=== Error in saveAsDraft() ===', {
                    error: error.toString(),
                    message: error.message,
                    stack: error.stack,
                    name: error.name,
                    currentUser: auth.currentUser ? 'User is logged in' : 'No user logged in'
                });

                // More specific error handling
                if (error.code) {
                    console.error('Firestore error code:', error.code);
                    console.error('Firestore error details:', error.details);
                }

                // Re-throw with more context
                const errorMessage = error.message || 'Unknown error occurred while saving draft';
                throw new Error(`Failed to save draft: ${errorMessage}`);
            } finally {
                console.log('=== End of saveAsDraft() ===');
            }
        }

        // Add click handler for the save draft button
        function initSaveDraftButton() {

                        class: btn.className,

        function previewTest() {
            // Implementation for previewing the test

        // Show a loading state on the publish button
        function setPublishButtonLoading(isLoading) {
            const publishBtn = document.querySelector('.publish-btn');
            if (publishBtn) {
                if (isLoading) {
                    publishBtn.disabled = true;
                    publishBtn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Publishing...';
                } else {
                    publishBtn.disabled = false;
                    publishBtn.innerHTML = '<i class="fas fa-cloud-upload-alt"></i> Publish Test';
                }
            }
        }

        // Publish the test
        async function publishTest() {
            const publishBtn = document.querySelector('.publish-btn');
            const modal = document.getElementById('publishModal');

            try {
                console.log('Starting test publication...');
                setPublishButtonLoading(true);

                // Show the publish modal
                updatePublishModal({
                    title: 'Publishing Test',
                    status: 'Preparing your test...',
                    progress: 0,
                    details: 'This may take a few moments'
                });

                // Ensure user is authenticated
                updatePublishModal({
                    status: 'Verifying your account...'
                });

                if (!currentUser) {
                    throw new Error('You must be logged in to publish a test.');
                }
                const user = currentUser;
                console.log('User authenticated for publishing:', user.email);

                // Start progress simulation
                await new Promise((resolve) => {
                    simulateProgress(resolve);
                });

                updatePublishModal({
                    status: 'Validating test data...',
                    progress: 95
                });

                // Get the test data
                updatePublishModal({
                    status: 'Preparing test data...'
                });

                const testData = getTestData();
                console.log('Test data prepared:', JSON.stringify(testData, null, 2));

                // Basic validation
                updatePublishModal({
                    status: 'Validating test content...'
                });

                if (!testData.title || testData.title.trim() === '') {
                    throw new Error('Please enter a test title');
                }

                if (!testData.sections || testData.sections.length === 0) {
                    throw new Error('Please add at least one section to the test');
                }

                // Get user data
                const userEmail = user.email || 'unknown@example.com';
                const userName = user.displayName || 'Teacher';
                const userType = localStorage.getItem('userType') || 'teacher';

                console.log('Publishing test as:', {
                    email: userEmail,
                    name: userName,
                    type: userType,
                    uid: user.uid
                });

                // Ensure we have a valid user type
                if (userType !== 'teacher') {
                    throw new Error('Only teachers can publish tests.');
                }

                // Prepare test data for Firestore with proper structure
                const testToSave = {
                    // Test metadata
                    title: testData.title.trim(),
                    description: (testData.description || '').trim(),
                    grade: testData.grade || '',
                    subject: testData.subject || 'Reading',
                    status: 'published',
                    isActive: true,
                    version: '1.0.0',

                    // User information
                    teacherId: user.uid, // Changed from createdBy to teacherId
                    createdByEmail: userEmail,
                    createdByName: userName,
                    userType: userType,

                    // Test content
                    sections: (testData.sections || []).map(section => ({
                        id: section.id || `section-${Date.now()}`,
                        title: section.title || 'Untitled Section',
                        type: section.type || 'letters',
                        instructions: section.instructions || '',
                        items: (section.items || []).map(item => ({
                            id: item.id || `item-${Date.now()}-${Math.random().toString(36).substr(2, 9)}`,
                            type: item.type || 'letter',
                            content: item.content || '',
                            points: parseInt(item.points) || 1,
                            example: item.example || '',
                            answer: item.answer || '',
                            focusWord: item.focusWord || '',
                            question: item.question || ''
                        })).filter(item => {
                            // Filter out empty items based on type
                            if (item.type === 'letter') return item.content.trim() !== '';
                            if (item.type === 'word') return item.content.trim() !== '' && item.answer.trim() !== '';
                            return true;
                        })
                    })).filter(section => section.items.length > 0), // Remove empty sections

                    // Timestamps
                    createdAt: serverTimestamp(),
                    updatedAt: serverTimestamp(),
                    publishedAt: serverTimestamp()
                };

                console.log('Saving test to Firestore...', testToSave);

                try {
                    // Save to Firestore
                    updatePublishModal({
                        status: 'Saving to database...',
                        progress: 98
                    });

                    const testsCollection = collection(db, 'tests');
                    const docRef = await addDoc(testsCollection, testToSave);

                    console.log('Test saved with ID:', docRef.id);

                    // Show success state
                    updatePublishModal({
                        title: 'Success!',
                        status: 'Test published successfully!',
                        progress: 100,
                        isSuccess: true,
                        details: 'Your test is now available for students.',
                        showClose: true
                    });

                    // Add event listener to close button
                    document.getElementById('publishCloseBtn').onclick = () => {
                        window.location.href = 'admin-dashboard.html';
                    };

                    // Auto-redirect after delay
                    setTimeout(() => {
                        if (document.getElementById('publishModal').classList.contains('show')) {
                            window.location.href = 'admin-dashboard.html';
                        }
                    }, 3000);

                    return docRef.id;
                } catch (firestoreError) {
                    console.error('Firestore error:', firestoreError);

                    let errorMessage = 'Failed to save test. Please try again.';

                    if (firestoreError.code === 'permission-denied') {
                        errorMessage = 'Permission denied. Please make sure you have the necessary permissions to publish tests.';
                    } else if (firestoreError.code === 'unavailable') {
                        errorMessage = 'Unable to connect to the server. Please check your internet connection.';
                    } else if (firestoreError.code === 'unauthenticated') {
                        errorMessage = 'Your session has expired. Please sign in and try again.';
                    } else if (firestoreError.message) {
                        errorMessage = firestoreError.message;
                    }

                    throw new Error(errorMessage);
                }
            } catch (error) {
                console.error('Error publishing test:', error);

                // Update modal to show error
                updatePublishModal({
                    title: 'Publishing Failed',
                    status: 'An error occurred',
                    details: error.message || 'Please try again later.',
                    isError: true,
                    showClose: true
                });

                // Add event listener to close button
                document.getElementById('publishCloseBtn').onclick = () => {
                    document.getElementById('publishModal').classList.remove('show');
                };

                // Re-enable the publish button
                setPublishButtonLoading(false);

                // Show error notification
                showNotification('Error: ' + error.message, 'error');

                // Re-throw the error for any error handling up the chain
                throw error;
            }
        }

        // Get all test data as an object
        function getTestData() {
            // Only include primitive types and arrays/objects of primitive types
            // Firestore doesn't support custom class instances or undefined values
            const testData = {
                title: document.getElementById('test-title')?.value || 'Untitled Test',
                description: document.getElementById('test-description')?.value || '',
                grade: document.getElementById('test-grade')?.value || '',
                subject: document.getElementById('test-subject')?.value || 'Reading',
                sections: [],
                teacherId: localStorage.getItem('userType') || 'teacher', // Changed from createdBy to teacherId
                // Note: We'll let Firestore handle the timestamps when saving
            };

            // Add sections data
            const sections = document.querySelectorAll('.section-card');
            sections.forEach((section, index) => {
                const sectionType = section.querySelector('.section-type')?.value || 'words';
                const sectionData = {
                    id: section.dataset.sectionId || `section-${Date.now()}-${index}`,
                    title: section.querySelector('.section-title-input')?.value || `Section ${index + 1}`,
                    type: sectionType,
                    instructions: section.querySelector('.section-instructions')?.value || '',
                    items: []
                };

                // Add items data
                const items = section.querySelectorAll('.item-card');
                items.forEach(item => {
                    const itemType = item.dataset.itemType || sectionType;
                    const itemContent = item.querySelector('.item-text')?.value ||
                        item.querySelector('.item-content')?.value || '';

                    // Skip empty items
                    if (itemType === 'letter' && itemContent.trim() === '') {
                        return; // Skip this item
                    }

                    const itemData = {
                        id: item.dataset.itemId || `item-${Date.now()}-${Math.random().toString(36).substr(2, 9)}`,
                        type: itemType,
                        content: itemContent,
                        points: parseInt(item.querySelector('.item-points')?.value) || 1,
                        // Common fields for all item types
                        ...(itemType === 'letter' && {
                            example: item.querySelector('.item-example')?.value || ''
                        }),
                        ...(itemType === 'sentence' && {
                            focusWord: item.querySelector('.item-focus')?.value || ''
                        }),
                        ...(itemType === 'passage' && {
                            title: item.querySelector('.item-title')?.value || '',
                            question: item.querySelector('.item-question')?.value || ''
                        })
                    };

                    // For word items, use the content as the answer if no specific answer field
                    if (itemType === 'word' && !itemData.answer) {
                        itemData.answer = itemContent;
                    }

                    sectionData.items.push(itemData);
                });

                testData.sections.push(sectionData);
            });

            return testData;
        }

        // Function to initialize draft loading
        function initDraftLoading() {
            const loadDraftBtn = document.getElementById('load-draft-btn');
            const draftsModal = document.getElementById('draftsModal');
            const closeModal = document.querySelector('#draftsModal .close');
            const cancelBtn = document.getElementById('cancelDraftLoad');
            const draftSearch = document.getElementById('draftSearch');

            if (!loadDraftBtn) {
                console.error('Load draft button not found');
                return;
            }

            // Open modal when Load Draft button is clicked
            loadDraftBtn.addEventListener('click', async () => {
                console.log('Load Draft button clicked');
                draftsModal.style.display = 'block';
                await loadDraftTests();
            });

            // Close modal when X is clicked
            closeModal.addEventListener('click', () => {
                draftsModal.style.display = 'none';
            });

            // Close modal when Cancel button is clicked
            cancelBtn.addEventListener('click', () => {
                draftsModal.style.display = 'none';
            });

            // Close when clicking outside the modal
            window.addEventListener('click', (event) => {
                if (event.target === draftsModal) {
                    draftsModal.style.display = 'none';
                }
            });

            // Search functionality
            draftSearch?.addEventListener('input', (e) => {
                const searchTerm = e.target.value.toLowerCase();
                const draftItems = document.querySelectorAll('.draft-item');

                draftItems.forEach(item => {
                    const title = item.querySelector('h4')?.textContent?.toLowerCase() || '';
                    if (title.includes(searchTerm)) {
                        item.style.display = '';
                    } else {
                        item.style.display = 'none';
                    }
                });
            });
        }

        // Function to load draft tests from Firestore
        async function loadDraftTests() {
            try {
                const user = auth.currentUser;
                if (!user) {
                    throw new Error('User not authenticated');
                }

                const draftsList = document.getElementById('draftsList');
                draftsList.innerHTML = '<div class="loading-drafts"><i class="fas fa-spinner fa-spin"></i> Loading drafts...</div>';

                // Query drafts for the current user
                const draftsQuery = query(
                    collection(db, 'draftTests'),
                    where('teacherId', '==', user.uid),
                    orderBy('updatedAt', 'desc')
                );

                const querySnapshot = await getDocs(draftsQuery);

                if (querySnapshot.empty) {
                    draftsList.innerHTML = '<div class="no-drafts">No draft tests found. Create a new test and save it as a draft.</div>';
                    return;
                }

                let draftsHtml = '';
                querySnapshot.forEach((doc) => {
                    const draft = doc.data();
                    const updatedAt = draft.updatedAt?.toDate ? draft.updatedAt.toDate() : new Date();
                    const formattedDate = updatedAt.toLocaleDateString('en-US', {
                        year: 'numeric',
                        month: 'short',
                        day: 'numeric',
                        hour: '2-digit',
                        minute: '2-digit'
                    });

                    draftsHtml += `
                            <div class="draft-item" data-draft-id="${doc.id}">
                                <h4>${draft.title || 'Untitled Test'}</h4>
                                <div class="draft-meta">
                                    <span>${draft.sections?.length || 0} sections</span>
                                    <span>Last updated: ${formattedDate}</span>
                                </div>
                            </div>
                        `;
                });

                draftsList.innerHTML = draftsHtml;

                // Add click handlers to draft items
                document.querySelectorAll('.draft-item').forEach(item => {
                    item.addEventListener('click', () => loadDraftIntoForm(item.dataset.draftId));
                });

            } catch (error) {
                console.error('Error loading drafts:', error);
                const draftsList = document.getElementById('draftsList');
                draftsList.innerHTML = `
                        <div class="error-loading">
                            <i class="fas fa-exclamation-triangle"></i>
                            <p>Failed to load drafts. Please try again.</p>
                            <button class="btn btn-sm btn-outline-primary" id="retryLoadDrafts">Retry</button>
                        </div>
                    `;

                document.getElementById('retryLoadDrafts')?.addEventListener('click', loadDraftTests);
            }
        }

        // Function to load a specific draft into the form
        async function loadDraftIntoForm(draftId) {
            try {
                const docRef = doc(db, 'draftTests', draftId);
                const docSnap = await getDoc(docRef);

                if (!docSnap.exists()) {
                    throw new Error('Draft not found');
                }

                const draft = docSnap.data();

                // Clear existing form data
                document.getElementById('test-title').value = draft.title || '';
                document.getElementById('test-grade').value = draft.grade || '';
                document.getElementById('test-time-limit').value = draft.timeLimit || '30';
                document.getElementById('test-instructions').value = draft.instructions || '';

                // Clear existing sections
                const sectionsContainer = document.getElementById('sections-container');
                sectionsContainer.innerHTML = '';
                sectionCount = 0;

                // Add sections from draft
                if (draft.sections && draft.sections.length > 0) {
                    for (const sectionData of draft.sections) {
                        await addNewSection();
                        const sections = document.querySelectorAll('.section-card');
                        const currentSection = sections[sections.length - 1];

                        // Set section title and type
                        currentSection.querySelector('.section-title-input').value = sectionData.title || '';
                        currentSection.querySelector('.section-type').value = sectionData.type || 'words';
                        currentSection.querySelector('.section-instructions').value = sectionData.instructions || '';

                        // Add items to section
                        const itemsContainer = currentSection.querySelector('.items-container');
                        itemsContainer.innerHTML = ''; // Clear any default items

                        if (sectionData.items && sectionData.items.length > 0) {
                            for (const itemData of sectionData.items) {
                                // Add a new item to the section
                                addNewItem(currentSection);

                                // Get the newly added item
                                const newItem = itemsContainer.lastElementChild;
                                if (!newItem) continue;

                                // Set the item content based on type
                                const itemInput = newItem.querySelector('.item-text');
                                if (itemInput) {
                                    itemInput.value = itemData.content || '';
                                }

                                // Set points if available
                                const pointsInput = newItem.querySelector('.item-points');
                                if (pointsInput && itemData.points) {
                                    pointsInput.value = itemData.points;
                                }

                                // For passage items, set additional fields
                                if (sectionData.type === 'passage') {
                                    const titleInput = newItem.querySelector('.item-title');
                                    const questionInput = newItem.querySelector('.item-question');

                                    if (titleInput) titleInput.value = itemData.title || '';
                                    if (questionInput) questionInput.value = itemData.question || '';
                                }

                                // For letter items, set example if exists
                                if (sectionData.type === 'letter' && itemData.example) {
                                    const exampleInput = newItem.querySelector('.item-example');
                                    if (exampleInput) exampleInput.value = itemData.example;
                                }

                                // For sentence items, set focus word if exists
                                if (sectionData.type === 'sentence' && itemData.focusWord) {
                                    const focusInput = newItem.querySelector('.item-focus');
                                    if (focusInput) focusInput.value = itemData.focusWord;
                                }
                            }
                        }
                    }
                }

                // Close the modal
                document.getElementById('draftsModal').style.display = 'none';
                showNotification('Draft loaded successfully!', 'success');

            } catch (error) {
                console.error('Error loading draft:', error);
                showNotification('Failed to load draft: ' + (error.message || 'Unknown error'), 'error');
            }
        }

        // Start the application
        initApp().then(async () => {
            // Initialize draft loading after app is initialized
            initDraftLoading();
        }).catch(error => {
            console.error('Failed to initialize application:', error);
            showNotification('Failed to initialize application. Please refresh the page.', 'error');
        });

        // Show notification to the user
        function showNotification(message, type = 'info') {
            // Create notification element
            const notification = document.createElement('div');
            notification.className = `notification ${type}`;
            notification.textContent = message;

            // Add to the page
            document.body.appendChild(notification);

            // Remove after 3 seconds
            setTimeout(() => {
                notification.remove();
            }, 3000);
        }
    </script>
    <script>
        // Sidebar toggle for mobile
        document.addEventListener('DOMContentLoaded', () => {
            const sidebar = document.getElementById('sidebar');
            const toggle = document.getElementById('sidebar-toggle');
            const overlay = document.getElementById('sidebar-overlay');
            if (toggle && sidebar) toggle.addEventListener('click', () => {
                sidebar.classList.toggle('active'); sidebar.classList.toggle('open');
                overlay?.classList.toggle('active'); overlay?.classList.toggle('open');
            });
            if (overlay) overlay.addEventListener('click', () => {
                sidebar.classList.remove('active','open'); overlay.classList.remove('active','open');
            });
        });
    </script>
</body>
